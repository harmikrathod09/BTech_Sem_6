<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button id="myBtn">Styled Button</button>
    <script>
        document.getElementById("myBtn").style.backgroundColor = "red";
        document.getElementById("myBtn").style.color = "white";
        document.getElementById("myBtn").style.fontSize = "20px";
        document.getElementById("myBtn").style.padding = "10px 20px";
        document.getElementById("myBtn").style.border = "none";
        document.getElementById("myBtn").style.borderRadius = "5px";
        document.getElementById("myBtn").style.cursor = "pointer";
    </script>
</body>
</html>
